# ISO/IEC 27001:2022 Annex A controls - ORIGINAL paraphrases (no verbatim ISO text).
# Clauses: A.5 Organizational, A.6 People, A.7 Physical, A.8 Technological.
framework: ISO
controls:
  # ---- A.5 Organizational controls (37) ----
  - control_id: "A.5.1"
    title: "Policies for information security"
    summary: >-
      The organization should define, approve, publish, and periodically review a
      set of information security policies so management direction is clear and
      staff understand their obligations.
  - control_id: "A.5.2"
    title: "Information security roles and responsibilities"
    summary: >-
      Security duties should be allocated to named roles and communicated so that
      accountability for protecting information assets is unambiguous.
  - control_id: "A.5.3"
    title: "Segregation of duties"
    summary: >-
      Conflicting responsibilities should be separated across people to reduce the
      risk of unauthorized or unintended modification or misuse of assets.
  - control_id: "A.5.4"
    title: "Management responsibilities"
    summary: >-
      Senior leaders are accountable for making sure everyone working under them
      actually follows the security rules, not just for publishing them.
  - control_id: "A.5.5"
    title: "Contact with authorities"
    summary: >-
      The organization should keep a means of contacting relevant authorities so
      incidents can be reported and guidance obtained when appropriate.
  - control_id: "A.5.6"
    title: "Contact with special interest groups"
    summary: >-
      Relationships with security forums, professional associations, and peer
      groups should be maintained so the organization stays current on emerging
      threats and good practice.
  - control_id: "A.5.7"
    title: "Threat intelligence"
    summary: >-
      Information about emerging threats should be gathered and analyzed so the
      organization can take timely, informed action to reduce its exposure.
  - control_id: "A.5.8"
    title: "Information security in project management"
    summary: >-
      Security considerations should be built into project management practices
      from the outset so risks are addressed throughout a project's lifecycle,
      not bolted on afterward.
  - control_id: "A.5.9"
    title: "Inventory of information and other associated assets"
    summary: >-
      The organization should maintain an accurate, up-to-date inventory of the
      information and assets it holds so that ownership and protection needs are
      known.
  - control_id: "A.5.10"
    title: "Acceptable use of information and other associated assets"
    summary: >-
      Rules for the permissible handling and use of information and assets
      should be documented and communicated so people understand what is
      expected of them.
  - control_id: "A.5.11"
    title: "Return of assets"
    summary: >-
      When someone leaves or a contract ends, anything of the organization's
      that they held must be handed back so no assets walk out the door.
  - control_id: "A.5.12"
    title: "Classification of information"
    summary: >-
      Information should be classified according to its sensitivity and
      importance so that appropriate levels of protection can be applied
      consistently.
  - control_id: "A.5.13"
    title: "Labelling of information"
    summary: >-
      A consistent labelling scheme aligned with the classification system
      should be used so people and systems can quickly recognize how information
      must be handled.
  - control_id: "A.5.14"
    title: "Information transfer"
    summary: >-
      Rules and safeguards for moving information between parties, systems, or
      locations should be established so that data stays protected in transit.
  - control_id: "A.5.15"
    title: "Access control"
    summary: >-
      Decide who is permitted to reach which information and systems, driven by
      what the business needs and what security demands, and then enforce those
      decisions.
  - control_id: "A.5.16"
    title: "Identity management"
    summary: >-
      The full lifecycle of user and system identities should be managed so that
      every actor accessing resources can be uniquely identified and traced.
  - control_id: "A.5.17"
    title: "Authentication information"
    summary: >-
      Passwords, tokens, and other authentication secrets should be issued,
      stored, and handled securely so they cannot be easily stolen or misused.
  - control_id: "A.5.18"
    title: "Access rights"
    summary: >-
      Access rights should be granted, reviewed, and revoked in line with the
      access control policy so that people hold only the permissions their role
      requires.
  - control_id: "A.5.19"
    title: "Information security in supplier relationships"
    summary: >-
      Risks arising from the use of suppliers should be identified and managed
      so that a vendor's weaknesses do not become the organization's own.
  - control_id: "A.5.20"
    title: "Addressing information security within supplier agreements"
    summary: >-
      Security expectations and obligations should be written into contracts
      with suppliers so requirements are enforceable rather than assumed.
  - control_id: "A.5.21"
    title: "Managing information security in the ICT supply chain"
    summary: >-
      The organization should manage security risks that arise across the chain
      of technology suppliers and subcontractors feeding into its products and
      services.
  - control_id: "A.5.22"
    title: "Monitoring, review and change management of supplier services"
    summary: >-
      Supplier performance and security posture should be tracked over time, and
      changes to the services they provide should be reviewed for new risk.
  - control_id: "A.5.23"
    title: "Information security for use of cloud services"
    summary: >-
      The acquisition, use, and exit from cloud services should follow defined
      security requirements so that shared responsibility with the provider is
      understood and managed.
  - control_id: "A.5.24"
    title: "Information security incident management planning and preparation"
    summary: >-
      The organization should plan in advance how it will detect, triage, and
      respond to security incidents so that a response can start immediately
      when one occurs.
  - control_id: "A.5.25"
    title: "Assessment and decision on information security events"
    summary: >-
      Observed security events should be evaluated against agreed criteria to
      decide whether they qualify as incidents requiring a formal response.
  - control_id: "A.5.26"
    title: "Response to information security incidents"
    summary: >-
      Confirmed incidents should be handled according to documented procedures
      so containment, eradication, and recovery happen in a consistent, timely
      way.
  - control_id: "A.5.27"
    title: "Learning from information security incidents"
    summary: >-
      Knowledge gained from past incidents should feed back into controls and
      procedures so similar events are less likely or less damaging in future.
  - control_id: "A.5.28"
    title: "Collection of evidence"
    summary: >-
      Evidence related to security events should be gathered, preserved, and
      handled using methods that keep it credible and admissible if needed
      later.
  - control_id: "A.5.29"
    title: "Information security during disruption"
    summary: >-
      The organization should define how it will sustain an adequate level of
      security for its critical operations while recovering from a disruptive
      event.
  - control_id: "A.5.30"
    title: "ICT readiness for business continuity"
    summary: >-
      ICT infrastructure and services should be planned and tested so they can
      be restored within timeframes that support the organization's continuity
      objectives.
  - control_id: "A.5.31"
    title: "Legal, statutory, regulatory and contractual requirements"
    summary: >-
      The organization should identify and keep track of all legal, regulatory,
      and contractual obligations bearing on information security so it remains
      compliant.
  - control_id: "A.5.32"
    title: "Intellectual property rights"
    summary: >-
      Procedures should ensure that intellectual property rights, whether owned
      or licensed, are respected and legally protected in the organization's use
      of information and software.
  - control_id: "A.5.33"
    title: "Protection of records"
    summary: >-
      Keep important records safe from being lost, altered, destroyed, or read
      by the wrong people for the whole period they must be retained.
  - control_id: "A.5.34"
    title: "Privacy and protection of personal identifiable information"
    summary: >-
      The handling of personal data should follow applicable privacy laws and
      the organization's own policies so individuals' information rights are
      respected.
  - control_id: "A.5.35"
    title: "Independent review of information security"
    summary: >-
      Have someone outside the team being examined periodically look at how
      security is run and carried out, and again whenever things change
      significantly.
  - control_id: "A.5.36"
    title: "Compliance with policies, rules and standards for information security"
    summary: >-
      Regular checks should confirm that systems, processes, and people actually
      operate in line with the organization's security policies and standards.
  - control_id: "A.5.37"
    title: "Documented operating procedures"
    summary: >-
      Write down how routine operational tasks are done and keep those
      instructions within reach, so the work gets done the same way whoever is
      on shift.

  # ---- A.6 People controls (8) ----
  - control_id: "A.6.1"
    title: "Screening"
    summary: >-
      Background checks on candidates should be carried out before hiring,
      proportionate to the role's access and risk, so trust is placed on a
      verified basis.
  - control_id: "A.6.2"
    title: "Terms and conditions of employment"
    summary: >-
      Employment contracts should spell out each person's information security
      responsibilities so expectations are agreed before work begins.
  - control_id: "A.6.3"
    title: "Information security awareness, education and training"
    summary: >-
      Personnel should receive ongoing awareness activities and training that
      keep them able to recognize risks and follow the organization's security
      practices.
  - control_id: "A.6.4"
    title: "Disciplinary process"
    summary: >-
      A formal, communicated process should exist for addressing personnel who
      breach information security policy, applied fairly and consistently.
  - control_id: "A.6.5"
    title: "Responsibilities after termination or change of employment"
    summary: >-
      Security obligations that survive the end or change of a role, such as
      confidentiality duties, should be defined and enforced even after
      departure.
  - control_id: "A.6.6"
    title: "Confidentiality or non-disclosure agreements"
    summary: >-
      Agreements protecting sensitive information should be identified, kept
      current, and signed by relevant staff and external parties.
  - control_id: "A.6.7"
    title: "Remote working"
    summary: >-
      Safeguards should be in place to protect information accessed or
      processed by people working from locations outside the organization's
      premises.
  - control_id: "A.6.8"
    title: "Information security event reporting"
    summary: >-
      A straightforward mechanism should let personnel report observed or
      suspected security weaknesses and events promptly through the proper
      channel.

  # ---- A.7 Physical controls (14) ----
  - control_id: "A.7.1"
    title: "Physical security perimeters"
    summary: >-
      Defined physical boundaries should be established around areas holding
      sensitive information or facilities to keep unauthorized people out.
  - control_id: "A.7.2"
    title: "Physical entry"
    summary: >-
      Entry to secure areas should be controlled and restricted to authorized
      individuals through appropriate mechanisms such as badges or escorts.
  - control_id: "A.7.3"
    title: "Securing offices, rooms and facilities"
    summary: >-
      Physical protection appropriate to their contents should be designed and
      applied to offices, rooms, and other facilities used for sensitive work.
  - control_id: "A.7.4"
    title: "Physical security monitoring"
    summary: >-
      Watch over the physical sites around the clock, using cameras, alarms, or
      guards, so that anyone entering without permission is noticed fast.
  - control_id: "A.7.5"
    title: "Protecting against physical and environmental threats"
    summary: >-
      Facilities should be designed and protected against natural disasters,
      fire, flooding, and other physical or environmental hazards.
  - control_id: "A.7.6"
    title: "Working in secure areas"
    summary: >-
      Rules for how people conduct themselves inside secure areas should be
      defined so activity in sensitive zones stays controlled.
  - control_id: "A.7.7"
    title: "Clear desk and clear screen"
    summary: >-
      Staff should keep desks free of sensitive papers and lock or clear
      screens when unattended so information is not exposed to passers-by.
  - control_id: "A.7.8"
    title: "Equipment siting and protection"
    summary: >-
      Equipment should be positioned and safeguarded to reduce exposure to
      environmental hazards and opportunities for unauthorized access.
  - control_id: "A.7.9"
    title: "Security of assets off-premises"
    summary: >-
      Assets taken outside organizational premises should receive protection
      equivalent to what they would receive on-site, given the added risk of
      loss or theft.
  - control_id: "A.7.10"
    title: "Storage media"
    summary: >-
      Storage media should be managed throughout acquisition, use, transport,
      and disposal so that the information they hold cannot leak or be
      recovered improperly.
  - control_id: "A.7.11"
    title: "Supporting utilities"
    summary: >-
      Power, cooling, and other utilities that facilities depend on should be
      protected against failure so information processing is not disrupted.
  - control_id: "A.7.12"
    title: "Cabling security"
    summary: >-
      Power and data cabling should be protected from interception, damage, or
      interference that could compromise the systems relying on it.
  - control_id: "A.7.13"
    title: "Equipment maintenance"
    summary: >-
      Hardware needs proper upkeep by trusted, approved technicians, which keeps
      it dependable and guards the information on it from interference.
  - control_id: "A.7.14"
    title: "Secure disposal or re-use of equipment"
    summary: >-
      Equipment containing storage media should be checked and sanitized before
      disposal or reuse so residual sensitive data is not exposed.

  # ---- A.8 Technological controls (34) ----
  - control_id: "A.8.1"
    title: "User endpoint devices"
    summary: >-
      Devices used to access or store organizational information should be
      protected through configuration and management standards appropriate to
      the risk they carry.
  - control_id: "A.8.2"
    title: "Privileged access rights"
    summary: >-
      The allocation and use of elevated system permissions should be tightly
      restricted and monitored because of the greater harm they can cause if
      misused.
  - control_id: "A.8.3"
    title: "Information access restriction"
    summary: >-
      Limit who can reach information and application features in line with the
      access control policy, instead of leaving things open unless blocked.
  - control_id: "A.8.4"
    title: "Access to source code"
    summary: >-
      Read and write access to source code, build tools, and related assets
      should be tightly controlled to prevent unauthorized changes.
  - control_id: "A.8.5"
    title: "Secure authentication"
    summary: >-
      Authentication mechanisms should be strong enough for the sensitivity of
      what they protect, using techniques suited to the associated risk.
  - control_id: "A.8.6"
    title: "Capacity management"
    summary: >-
      The use of computing, storage, and network resources should be monitored
      and forecast so capacity keeps pace with demand and avoids service
      failures.
  - control_id: "A.8.7"
    title: "Protection against malware"
    summary: >-
      Defenses against malicious software should be deployed and kept current,
      combined with user awareness, to prevent and detect infection.
  - control_id: "A.8.8"
    title: "Management of technical vulnerabilities"
    summary: >-
      Technical vulnerabilities in systems in use should be identified,
      evaluated, and remediated in a timely manner to limit the window of
      exposure.
  - control_id: "A.8.9"
    title: "Configuration management"
    summary: >-
      Secure baseline configurations for hardware, software, and services
      should be defined, applied, and monitored for drift.
  - control_id: "A.8.10"
    title: "Information deletion"
    summary: >-
      Information no longer required should be deleted from systems, devices,
      and media when it is no longer needed, reducing unnecessary exposure.
  - control_id: "A.8.11"
    title: "Data masking"
    summary: >-
      Techniques such as masking or anonymization should be used to limit
      exposure of sensitive data, particularly where legal or business
      constraints apply.
  - control_id: "A.8.12"
    title: "Data leakage prevention"
    summary: >-
      Measures should be applied across systems and networks to detect and
      prevent the unauthorized disclosure or extraction of sensitive
      information.
  - control_id: "A.8.13"
    title: "Information backup"
    summary: >-
      Make copies of data, software, and system images on a schedule and
      rehearse restoring them, so a loss or corruption event is recoverable.
  - control_id: "A.8.14"
    title: "Redundancy of information processing facilities"
    summary: >-
      Processing facilities should be built with enough redundancy to meet
      availability requirements even when a component fails.
  - control_id: "A.8.15"
    title: "Logging"
    summary: >-
      Activity across systems and applications should be logged, protected, and
      retained so that events can be reconstructed and investigated later.
  - control_id: "A.8.16"
    title: "Monitoring activities"
    summary: >-
      Networks, systems, and applications should be watched for anomalous
      behavior so potential security incidents are noticed and can be acted
      upon.
  - control_id: "A.8.17"
    title: "Clock synchronization"
    summary: >-
      System clocks across the organization's systems should be synchronized
      to a common, reliable time source so that logs and events can be
      correlated accurately.
  - control_id: "A.8.18"
    title: "Use of privileged utility programs"
    summary: >-
      Tools that can bypass normal safeguards on systems or applications are
      dangerous, so limit who can run them and watch how they are used.
  - control_id: "A.8.19"
    title: "Installation of software on operational systems"
    summary: >-
      Rules and procedures should govern how software is installed on live
      systems so that only approved, vetted software reaches production.
  - control_id: "A.8.20"
    title: "Networks security"
    summary: >-
      Keep networks and the equipment attached to them secured and under
      control, so the data crossing them stays protected.
  - control_id: "A.8.21"
    title: "Security of network services"
    summary: >-
      Work out what protections and service guarantees each network service
      needs, and make sure they are in place whether the provider is internal
      staff or an outside vendor.
  - control_id: "A.8.22"
    title: "Segregation of networks"
    summary: >-
      Split the network into separate zones for different services, users, and
      systems, so an intruder who gets into one zone cannot easily roam into the
      rest.
  - control_id: "A.8.23"
    title: "Web filtering"
    summary: >-
      Access to external websites should be managed and filtered to reduce
      exposure to malicious content and inappropriate material.
  - control_id: "A.8.24"
    title: "Use of cryptography"
    summary: >-
      Decide how encryption will be used, including how keys are looked after,
      and then follow those rules to keep information protected.
  - control_id: "A.8.25"
    title: "Secure development life cycle"
    summary: >-
      Security requirements and activities should be embedded into every stage
      of the software development lifecycle rather than added at the end.
  - control_id: "A.8.26"
    title: "Application security requirements"
    summary: >-
      Before building or buying an application, work out what security it must
      provide, write that down, and get it signed off.
  - control_id: "A.8.27"
    title: "Secure system architecture and engineering principles"
    summary: >-
      Systems should be designed and built following established secure
      engineering principles so security is structural rather than an
      afterthought.
  - control_id: "A.8.28"
    title: "Secure coding"
    summary: >-
      Secure coding principles should be applied throughout development so
      common classes of software vulnerability are avoided from the outset.
  - control_id: "A.8.29"
    title: "Security testing in development and acceptance"
    summary: >-
      Security testing should be defined and carried out during development and
      before acceptance so weaknesses are caught before systems go live.
  - control_id: "A.8.30"
    title: "Outsourced development"
    summary: >-
      Development work carried out by external parties should be directed,
      monitored, and reviewed so it meets the organization's security
      requirements.
  - control_id: "A.8.31"
    title: "Separation of development, test and production environments"
    summary: >-
      Development, testing, and production environments should be kept apart
      so changes cannot inadvertently or maliciously affect live systems.
  - control_id: "A.8.32"
    title: "Change management"
    summary: >-
      Changes to information processing facilities and systems should follow a
      controlled process so their security impact is assessed before they are
      applied.
  - control_id: "A.8.33"
    title: "Test information"
    summary: >-
      Data used for testing should be selected, protected, and managed
      carefully so that sensitive production information is not exposed
      through test activities.
  - control_id: "A.8.34"
    title: "Protection of information systems during audit testing"
    summary: >-
      Audits and technical assessments of operational systems should be planned
      and controlled to avoid disrupting business processes or causing
      unintended harm.

[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel — grounded governance/compliance Q&A API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "sse-starlette>=2.1",
    "sentence-transformers>=3.0",
    # Direct dependency only so the CPU wheel index below applies (see tool.uv.sources).
    "torch>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv.sources]
# CPU-only torch: the models are small MiniLM encoders, and PyPI's Linux torch pulls
# several GB of CUDA libraries into the image. macOS wheels on PyPI are already CPU.
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: fast in-process unit tests",
    "integration: requires Postgres via docker-compose (DATABASE_URL)",
    "corpus: full-corpus count / no-verbatim / mapping-integrity tests (fast; run in CI)",
]
